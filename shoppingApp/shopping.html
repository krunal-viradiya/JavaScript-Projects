<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Application</title>
    <style>
        body {
            background-color: black;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 0;
            color: white;
        }

        .container {
            background-color: rgb(31, 31, 31);
            padding: 10px 30px;
            border-radius: 30px;
            /* height: auto; */
            min-height: 400px;
            box-sizing: border-box;
        }

        .container h1 {
            color: white;
        }

        .product-data {
            color: white;
        }

        .product-cart-list {
            margin-top: 20px;
            width: 100%;
            height: 40px;
        }

        .product-cart-list p {
            padding: 0;
            margin: 0;
            color: white;
        }

        .checkout-data {
            color: white;
            display: flex;
            flex-direction: column;
            align-items: end;
            /* justify-content: end; */
        }

        .checkout-data button {
            height: 40px;
            color: white;
            background-color: blueviolet;
            border-radius: 10px;
            outline: none;
            border: none;
            gap: -10px;
        }
        
        .new-style {
            
            width: 200px;
            background-color: black;
            padding: 10px 20px;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            /* gap: 10px; */
            border-radius: 15px;
        }

        .new-style button {
            height: 40px;
            color: white;
            background-color: blueviolet;
            border-radius: 10px;
            outline: none;
            border: none;
        }

        .hidden {
            visibility: hidden;
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>Shopping App</h1>
        <div class="product-data" id="product-data">
           
        </div>
        <p id="empty_cart">Your cart is empty.</p>
        <div class="product-cart-list" id="product-cart-list">
            
        </div>
        <div class="checkout-data " id="checkout-data">
            <p>Total : <span id="total_price"> $0.00 </span></p>
            <button id="checkout">Checkout</button>
        </div>
    </div>

    <script src="shopping.js"></script>

</body>
</html>
